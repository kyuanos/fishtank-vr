<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anamorphic Portal Box - Screen Fitted</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #stage { width: 100vw; height: 100vh; display: block; }
    #ui {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      color: #6bffb8; background: rgba(0,0,0,0.8); padding: 8px 16px;
      border-radius: 8px; font-family: sans-serif; font-size: 0.8rem; pointer-events: none;
      z-index: 10;
    }
  </style>
  <!-- Three.js & MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui">カメラ・画像を読み込んでいます...</div>
  <canvas id="stage"></canvas>
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('ui');
    const videoElement = document.getElementById('webcam');

    // 1. Scene & Renderer Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // カメラの基準位置 (Z=5)
    const baseCameraZ = 5;
    camera.position.set(0, 0, baseCameraZ);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // 2. Load Textures
    const textureLoader = new THREE.TextureLoader();
    const materials = [
      new THREE.MeshBasicMaterial({ map: textureLoader.load('右壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('左壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('天井壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('床.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('奥壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, side: THREE.BackSide }) // 手前（透明）
    ];

    let room;
    let screenWidth = 0;
    let screenHeight = 0;
    const depthRatio = 0.35; // 奥行きの深さ倍率

    // 3. 画面サイズ（Z=0）に合わせて箱を完全フィットさせる関数
    function fitRoomToScreen() {
      const fovRad = (camera.fov * Math.PI) / 180;
      const aspect = window.innerWidth / window.innerHeight;

      // Z=0（画面位置）における正確な表示幅・高さ
      screenHeight = 2 * Math.tan(fovRad / 2) * baseCameraZ;
      screenWidth = screenHeight * aspect;
      const roomDepth = screenHeight * depthRatio;

      if (room) {
        scene.remove(room);
        room.geometry.dispose();
      }

      // 箱を作成（手前フチがちょうど Z=0 になるように配置）
      const boxGeo = new THREE.BoxGeometry(screenWidth, screenHeight, roomDepth);
      room = new THREE.Mesh(boxGeo, materials);
      room.position.set(0, 0, -roomDepth / 2);
      scene.add(room);
    }

    fitRoomToScreen();

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      renderer.setSize(w, h);
      fitRoomToScreen();
    });

    // 4. Off-Axis Projection（四隅固定視体積計算）
    function setOffAxisProjection(headX, headY) {
      // 顔の位置に応じたカメラ位置（左右の動きを正常化するため headX は反転）
      const camX = -headX * 4;
      const camY = -headY * 4;
      const camZ = baseCameraZ;

      camera.position.set(camX, camY, camZ);

      // 画面の四隅 (Z=0 Plane)
      const left   = -screenWidth / 2 - camX;
      const right  =  screenWidth / 2 - camX;
      const top    =  screenHeight / 2 - camY;
      const bottom = -screenHeight / 2 - camY;

      const near = camera.near;
      const far  = camera.far;

      // 近クリップ面(near)での表示領域をスケール補正
      const scale = near / camZ;
      const l = left * scale;
      const r = right * scale;
      const t = top * scale;
      const b = bottom * scale;

      // カメラの透視投影行列をカスタム設定（四隅をディスプレイ枠に固定）
      camera.projectionMatrix.makePerspective(l, r, t, b, near, far);
    }

    // 5. Face Tracking Setup
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const nose = results.multiFaceLandmarks[0][1];
        targetX = (nose.x - 0.5);
        targetY = (nose.y - 0.5);
        logElem.innerText = `追従中 | X: ${targetX.toFixed(2)}, Y: ${targetY.toFixed(2)}`;
      }
    });

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideo();
          render();
        };
      } catch (e) {
        logElem.innerText = "カメラエラー: " + e.message;
      }
    }

    async function processVideo() {
      if (videoElement.readyState >= 2) {
        await faceMesh.send({ image: videoElement });
      }
      requestAnimationFrame(processVideo);
    }

    function render() {
      // 滑らかな移動（LERP補間）
      currentX += (targetX - currentX) * 0.12;
      currentY += (targetY - currentY) * 0.12;

      setOffAxisProjection(currentX, currentY);

      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    initCamera();
  </script>
</body>
</html>
