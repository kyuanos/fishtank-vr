<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM Auto-Fit Object</title>
  
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111; color: #fff;
      font-family: sans-serif;
    }
    x3d {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; margin: 0; padding: 0;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #6bffb8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>X3DOM 視線追従 (自動全体収め)</h2>
    <div id="debug-log">初期化中...</div>
  </div>

  <x3d id="x3dCanvas">
    <scene>
      <!-- カメラ位置 (初期値: Z=5、fieldOfViewは約45度/0.785rad) -->
      <viewpoint id="vp" position="0 0 5" orientation="0 1 0 0" fieldOfView="0.785"></viewpoint>
      
      <!-- テスト用ボックス (例として幅5.0、高さ2.0、奥行き1.0の直方体にしてみます) -->
      <transform id="targetBox" rotation="0 1 0 0" translation="0 0 0">
        <shape>
          <appearance>
            <material diffuseColor="0.2 0.7 1.0" specularColor="0.5 0.5 0.5"></material>
          </appearance>
          <!-- ★ここをどんなサイズ(例: 10 3 2 等)に変えても画面内に収まります -->
          <box size="5.0 2.0 1.0"></box>
        </shape>
      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) {
      logElem.innerText = msg;
    }

    const vp = document.getElementById('vp');
    const targetBox = document.getElementById('targetBox');
    const videoElement = document.getElementById('webcam');

    let baseCameraZ = 5; // 自動計算された最適なカメラ距離

    // -------------------------------------------------------------
    // 物体の大きさに応じてカメラ距離(Z)を自動調整する関数
    // -------------------------------------------------------------
    function fitObjectToScreen() {
      if (!targetBox || !targetBox._x3domNode) return;

      try {
        // X3DOMのノードからバウンディングボックス（最小値/最大値）を取得
        const bbox = targetBox._x3domNode.getBBox();
        const min = bbox.min;
        const max = bbox.max;

        // 物体の幅・高さ・奥行きを計算
        const sizeX = max.x - min.x;
        const sizeY = max.y - min.y;
        const sizeZ = max.z - min.z;

        // 物体の最大の対角線半径（または最も大きい幅・高さ）を取得
        const maxDimension = Math.max(sizeX, sizeY, sizeZ);

        // カメラの視野角 (FOV: ラジアン)
        const fov = parseFloat(vp.getAttribute('fieldOfView')) || 0.785;
        const aspect = window.innerWidth / window.innerHeight;

        // 画面の縦横比を考慮して最適な視野サイズを確定
        const fovFactor = aspect < 1 ? (fov * aspect) : fov;

        // 画面内に安全に収めるための距離計算 (少し余裕を持たせるため 1.2 倍の安全係数を乗算)
        const marginFactor = 1.2;
        baseCameraZ = (maxDimension / (2 * Math.tan(fovFactor / 2))) * marginFactor;

        // カメラのZ位置を更新
        vp.setAttribute('position', `0 0 ${baseCameraZ.toFixed(2)}`);
        log(`自動フィット完了 | 物体サイズ: ${sizeX.toFixed(1)}x${sizeY.toFixed(1)}x${sizeZ.toFixed(1)} -> カメラ距離Z: ${baseCameraZ.toFixed(2)}`);
      } catch (e) {
        log("フィット計算待ち...");
      }
    }

    // X3DOMのロード完了時および画面リサイズ時に実行
    document.addEventListener('x3dom-loaded', () => {
      setTimeout(fitObjectToScreen, 200); // 描画構築を待って適用
    }, false);

    window.addEventListener('resize', fitObjectToScreen);

    // -------------------------------------------------------------
    // MediaPipe Face Mesh
    // -------------------------------------------------------------
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        const offsetX = (nose.x - 0.5);
        const offsetY = (nose.y - 0.5);

        const sensitivity = 1.2;

        const rotX = -offsetY * sensitivity; 
        const rotY =  offsetX * sensitivity; // 左右逆（右下覗き込み対応）

        const angle = Math.sqrt(rotX * rotX + rotY * rotY);

        if (angle > 0.001) {
          const axisX = rotX / angle;
          const axisY = rotY / angle;
          targetBox.setAttribute('rotation', `${axisX.toFixed(3)} ${axisY.toFixed(3)} 0 ${angle.toFixed(3)}`);
        } else {
          targetBox.setAttribute('rotation', '0 1 0 0');
        }
      }
    });

    // Webカメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message);
      }
    }

    async function processVideoFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await faceMesh.send({ image: videoElement });
        requestAnimationFrame(processVideoFrame);
      }
    }

    startCamera();
  </script>
</body>
</html>
