<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM Portal Projection Box</title>
  
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000; color: #fff;
      font-family: sans-serif;
    }
    x3d {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; margin: 0; padding: 0;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #6bffb8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>デジタルフィギュア箱（窓枠完全固定モデル）</h2>
    <div id="debug-log">カメラ許可を待っています...</div>
  </div>

  <x3d id="x3dCanvas">
    <scene>
      <!-- カメラ位置 -->
      <viewpoint id="vp" position="0 0 5" orientation="0 1 0 0" fieldOfView="0.785"></viewpoint>
      
      <!-- ショーケース（箱）グループ：回転は一切行いません -->
      <transform id="roomGroup" translation="0 0 0">
        
        <!-- 奥の壁 -->
        <transform id="backWall">
          <shape>
            <appearance><material diffuseColor="0.1 0.1 0.15"></material></appearance>
            <box id="backWallBox" size="1 1 0.001"></box>
          </shape>
        </transform>

        <!-- 床 -->
        <transform id="floor" rotation="1 0 0 -1.5708">
          <shape>
            <appearance><material diffuseColor="0.15 0.05 0.25" specularColor="0.8 0.2 0.8"></material></appearance>
            <box id="floorBox" size="1 1 0.001"></box>
          </shape>
        </transform>

        <!-- 天井 -->
        <transform id="ceiling" rotation="1 0 0 1.5708">
          <shape>
            <appearance><material diffuseColor="0.05 0.05 0.1"></material></appearance>
            <box id="ceilingBox" size="1 1 0.001"></box>
          </shape>
        </transform>

        <!-- 左の壁 -->
        <transform id="leftWall" rotation="0 1 0 1.5708">
          <shape>
            <appearance><material diffuseColor="0.08 0.08 0.12"></material></appearance>
            <box id="leftWallBox" size="1 1 0.001"></box>
          </shape>
        </transform>

        <!-- 右の壁 -->
        <transform id="rightWall" rotation="0 1 0 -1.5708">
          <shape>
            <appearance><material diffuseColor="0.08 0.08 0.12"></material></appearance>
            <box id="rightWallBox" size="1 1 0.001"></box>
          </shape>
        </transform>

        <!-- 中央のフィギュア / オブジェクト -->
        <transform id="targetBox" translation="0 0 0">
          <shape>
            <appearance>
              <material diffuseColor="0.2 0.8 1.0" specularColor="0.8 0.8 0.8"></material>
            </appearance>
            <box id="objectShape" size="1 1 1"></box>
          </shape>
        </transform>

      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) { logElem.innerText = msg; }

    const vp = document.getElementById('vp');
    const videoElement = document.getElementById('webcam');

    // 壁・床ノード要素
    const backWall = document.getElementById('backWall');
    const backWallBox = document.getElementById('backWallBox');
    const floor = document.getElementById('floor');
    const floorBox = document.getElementById('floorBox');
    const ceiling = document.getElementById('ceiling');
    const ceilingBox = document.getElementById('ceilingBox');
    const leftWall = document.getElementById('leftWall');
    const leftWallBox = document.getElementById('leftWallBox');
    const rightWall = document.getElementById('rightWall');
    const rightWallBox = document.getElementById('rightWallBox');
    const targetBox = document.getElementById('targetBox');
    const objectShape = document.getElementById('objectShape');

    const baseCameraZ = 5;

    // -------------------------------------------------------------
    // 画面サイズにぴったり合わせた箱のサイズ設定
    // -------------------------------------------------------------
    function updateRoomSize() {
      const fov = parseFloat(vp.getAttribute('fieldOfView')) || 0.785;
      const aspect = window.innerWidth / window.innerHeight;

      // 画面（Z=0）における窓枠サイズ
      const roomHeight = 2 * Math.tan(fov / 2) * baseCameraZ;
      const roomWidth = roomHeight * aspect;
      const roomDepth = roomHeight * 0.8;
      const wallThickness = 0.001;

      // 箱の前フチを Z=0（画面の位置）に合わせる
      backWallBox.setAttribute('size', `${roomWidth} ${roomHeight} ${wallThickness}`);
      backWall.setAttribute('translation', `0 0 ${-roomDepth}`);

      floorBox.setAttribute('size', `${roomWidth} ${roomDepth} ${wallThickness}`);
      floor.setAttribute('translation', `0 ${-roomHeight / 2} ${-roomDepth / 2}`);

      ceilingBox.setAttribute('size', `${roomWidth} ${roomDepth} ${wallThickness}`);
      ceiling.setAttribute('translation', `0 ${roomHeight / 2} ${-roomDepth / 2}`);

      leftWallBox.setAttribute('size', `${roomDepth} ${roomHeight} ${wallThickness}`);
      leftWall.setAttribute('translation', `${-roomWidth / 2} 0 ${-roomDepth / 2}`);

      rightWallBox.setAttribute('size', `${roomDepth} ${roomHeight} ${wallThickness}`);
      rightWall.setAttribute('translation', `${roomWidth / 2} 0 ${-roomDepth / 2}`);

      // フィギュアのサイズ・位置
      const objScale = Math.min(roomWidth, roomHeight) * 0.45;
      objectShape.setAttribute('size', `${objScale} ${objScale * 1.3} ${objScale}`);
      targetBox.setAttribute('translation', `0 ${-roomHeight / 2 + (objScale * 1.3) / 2} ${-roomDepth / 2}`);
    }

    window.addEventListener('resize', updateRoomSize);
    updateRoomSize();

    // MediaPipe Face Mesh
    let frameCount = 0;
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      frameCount++;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        const offsetX = (nose.x - 0.5);
        const offsetY = (nose.y - 0.5);

        // 視差移動の強度
        const moveScale = 3.5;

        // ★ここが最大のポイント！
        // 箱を回転させるのではなく、カメラの「位置(Position)」と「注視(Orientation)」を変更します。
        // 箱の前フチ（Z=0）は常に画面の端と密着固定されたまま、覗き込んだ角度だけ奥がズレて見えます。
        const camX =  offsetX * moveScale;
        const camY = -offsetY * moveScale;
        const camZ = baseCameraZ;

        // 1. カメラを頭の位置へ移動
        vp.setAttribute('position', `${camX.toFixed(3)} ${camY.toFixed(3)} ${camZ.toFixed(3)}`);

        // 2. カメラの向きを画面中央（0,0,0）に向ける
        const rotY = -Math.atan2(camX, camZ);
        const rotX =  Math.atan2(camY, Math.sqrt(camX * camX + camZ * camZ));
        const angle = Math.sqrt(rotX * rotX + rotY * rotY);

        if (angle > 0.001) {
          const axisX = rotX / angle;
          const axisY = rotY / angle;
          vp.setAttribute('orientation', `${axisX.toFixed(3)} ${axisY.toFixed(3)} 0 ${angle.toFixed(3)}`);
        } else {
          vp.setAttribute('orientation', '0 1 0 0');
        }

        log(`[#${frameCount}] 追従中 | 視点移動: X=${camX.toFixed(2)}, Y=${camY.toFixed(2)}`);
      } else {
        log(`[#${frameCount}] 顔を検出できません`);
      }
    });

    // Webカメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message);
      }
    }

    async function processVideoFrame() {
      if (videoElement.readyState >= 2 && !videoElement.paused && !videoElement.ended) {
        try {
          await faceMesh.send({ image: videoElement });
        } catch (e) {
          console.error("FaceMeshエラー:", e);
        }
      }
      requestAnimationFrame(processVideoFrame);
    }

    startCamera();
  </script>
</body>
</html>
