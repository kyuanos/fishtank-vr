<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM 3D Box Hologram Tracking</title>
  
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000; color: #fff;
      font-family: sans-serif;
    }
    x3d {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; margin: 0; padding: 0;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #6bffb8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>デジタルフィギュア箱（画面ピッタリ表示）</h2>
    <div id="debug-log">カメラ許可を待っています...</div>
  </div>

  <x3d id="x3dCanvas">
    <scene>
      <viewpoint id="vp" position="0 0 5" orientation="0 1 0 0" fieldOfView="0.785"></viewpoint>
      
      <!-- ショーケース（箱）グループ -->
      <transform id="roomGroup" rotation="0 1 0 0" translation="0 0 0">
        
        <!-- 奥の壁 -->
        <transform id="backWall">
          <shape>
            <appearance><material diffuseColor="0.1 0.1 0.15"></material></appearance>
            <box id="backWallBox" size="1 1 0.1"></box>
          </shape>
        </transform>

        <!-- 床 -->
        <transform id="floor" rotation="1 0 0 -1.5708">
          <shape>
            <appearance><material diffuseColor="0.15 0.05 0.25" specularColor="0.8 0.2 0.8"></material></appearance>
            <box id="floorBox" size="1 1 0.1"></box>
          </shape>
        </transform>

        <!-- 天井 -->
        <transform id="ceiling" rotation="1 0 0 1.5708">
          <shape>
            <appearance><material diffuseColor="0.05 0.05 0.1"></material></appearance>
            <box id="ceilingBox" size="1 1 0.1"></box>
          </shape>
        </transform>

        <!-- 左の壁 -->
        <transform id="leftWall" rotation="0 1 0 1.5708">
          <shape>
            <appearance><material diffuseColor="0.08 0.08 0.12"></material></appearance>
            <box id="leftWallBox" size="1 1 0.1"></box>
          </shape>
        </transform>

        <!-- 右の壁 -->
        <transform id="rightWall" rotation="0 1 0 -1.5708">
          <shape>
            <appearance><material diffuseColor="0.08 0.08 0.12"></material></appearance>
            <box id="rightWallBox" size="1 1 0.1"></box>
          </shape>
        </transform>

        <!-- 中央のフィギュア / オブジェクト -->
        <transform id="targetBox" translation="0 0 0">
          <shape>
            <appearance>
              <material diffuseColor="0.2 0.8 1.0" specularColor="0.8 0.8 0.8"></material>
            </appearance>
            <box id="objectShape" size="1 1 1"></box>
          </shape>
        </transform>

      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) { logElem.innerText = msg; }

    const vp = document.getElementById('vp');
    const roomGroup = document.getElementById('roomGroup');
    const videoElement = document.getElementById('webcam');

    // ノード要素
    const backWall = document.getElementById('backWall');
    const backWallBox = document.getElementById('backWallBox');
    const floor = document.getElementById('floor');
    const floorBox = document.getElementById('floorBox');
    const ceiling = document.getElementById('ceiling');
    const ceilingBox = document.getElementById('ceilingBox');
    const leftWall = document.getElementById('leftWall');
    const leftWallBox = document.getElementById('leftWallBox');
    const rightWall = document.getElementById('rightWall');
    const rightWallBox = document.getElementById('rightWallBox');
    const targetBox = document.getElementById('targetBox');
    const objectShape = document.getElementById('objectShape');

    // -------------------------------------------------------------
    // 画面サイズに応じて「箱の縦横高さ」を自動ジャストフィットさせる処理
    // -------------------------------------------------------------
    function updateRoomSize() {
      const cameraZ = 5;
      const fov = parseFloat(vp.getAttribute('fieldOfView')) || 0.785; // 45度
      const aspect = window.innerWidth / window.innerHeight;

      // カメラから画面開口部（Z=0）における見える視野幅と高さ
      const roomHeight = 2 * Math.tan(fov / 2) * cameraZ;
      const roomWidth = roomHeight * aspect;
      // 奥行きは画面幅・高さに合わせた使いやすい深さに設定（画面の高さと同程度）
      const roomDepth = roomHeight * 0.8;

      // 1. 各壁のサイズと位置を更新（画面の四隅にぴったり密着）
      // 奥の壁
      backWallBox.setAttribute('size', `${roomWidth} ${roomHeight} 0.1`);
      backWall.setAttribute('translation', `0 0 ${-roomDepth}`);

      // 床
      floorBox.setAttribute('size', `${roomWidth} ${roomDepth} 0.1`);
      floor.setAttribute('translation', `0 ${-roomHeight / 2} ${-roomDepth / 2}`);

      // 天井
      ceilingBox.setAttribute('size', `${roomWidth} ${roomDepth} 0.1`);
      ceiling.setAttribute('translation', `0 ${roomHeight / 2} ${-roomDepth / 2}`);

      // 左の壁
      leftWallBox.setAttribute('size', `${roomDepth} ${roomHeight} 0.1`);
      leftWall.setAttribute('translation', `${-roomWidth / 2} 0 ${-roomDepth / 2}`);

      // 右の壁
      rightWallBox.setAttribute('size', `${roomDepth} ${roomHeight} 0.1`);
      rightWall.setAttribute('translation', `${roomWidth / 2} 0 ${-roomDepth / 2}`);

      // 2. 中央のフィギュアの大きさ・位置も箱に合わせて調整
      const objScale = Math.min(roomWidth, roomHeight) * 0.45;
      objectShape.setAttribute('size', `${objScale} ${objScale * 1.3} ${objScale}`);
      targetBox.setAttribute('translation', `0 ${-roomHeight / 2 + (objScale * 1.3) / 2} ${-roomDepth / 2}`);
    }

    window.addEventListener('resize', updateRoomSize);
    updateRoomSize();

    // MediaPipe Face Mesh
    let frameCount = 0;
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      frameCount++;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        const offsetX = (nose.x - 0.5);
        const offsetY = (nose.y - 0.5);

        const sensitivity = 1.2;

        const rotX = -offsetY * sensitivity; 
        const rotY =  offsetX * sensitivity; 

        const angle = Math.sqrt(rotX * rotX + rotY * rotY);

        if (angle > 0.001) {
          const axisX = rotX / angle;
          const axisY = rotY / angle;
          roomGroup.setAttribute('rotation', `${axisX.toFixed(3)} ${axisY.toFixed(3)} 0 ${angle.toFixed(3)}`);
        } else {
          roomGroup.setAttribute('rotation', '0 1 0 0');
        }

        log(`[#${frameCount}] 追従中 | 視線オフセット: X=${offsetX.toFixed(2)}, Y=${offsetY.toFixed(2)}`);
      } else {
        log(`[#${frameCount}] 顔を検出できません`);
      }
    });

    // Webカメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message);
      }
    }

    async function processVideoFrame() {
      if (videoElement.readyState >= 2 && !videoElement.paused && !videoElement.ended) {
        try {
          await faceMesh.send({ image: videoElement });
        } catch (e) {
          console.error("FaceMeshエラー:", e);
        }
      }
      requestAnimationFrame(processVideoFrame);
    }

    startCamera();
  </script>
</body>
</html>
