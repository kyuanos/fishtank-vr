<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM 3D Box Hologram Tracking</title>
  
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000; color: #fff;
      font-family: sans-serif;
    }
    x3d {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; margin: 0; padding: 0;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #6bffb8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>デジタルフィギュア箱（ホログラム表示）</h2>
    <div id="debug-log">カメラ許可を待っています...</div>
  </div>

  <x3d id="x3dCanvas">
    <scene>
      <viewpoint id="vp" position="0 0 5" orientation="0 1 0 0" fieldOfView="0.785"></viewpoint>
      
      <!-- 全体を格納するショーケース（箱）グループ -->
      <transform id="roomGroup" rotation="0 1 0 0" translation="0 0 0">
        
        <!-- 【奥の壁】 -->
        <transform translation="0 0 -2">
          <shape>
            <appearance><material diffuseColor="0.1 0.1 0.15"></material></appearance>
            <box size="4 4 0.1"></box>
          </shape>
        </transform>

        <!-- 【床（魔法陣風・グリッド風パターン）】 -->
        <transform translation="0 -2 0" rotation="1 0 0 -1.5708">
          <shape>
            <appearance><material diffuseColor="0.15 0.05 0.25" specularColor="0.8 0.2 0.8"></material></appearance>
            <box size="4 4 0.1"></box>
          </shape>
        </transform>

        <!-- 【左の壁】 -->
        <transform translation="-2 0 0" rotation="0 1 0 1.5708">
          <shape>
            <appearance><material diffuseColor="0.08 0.08 0.12"></material></appearance>
            <box size="4 4 0.1"></box>
          </shape>
        </transform>

        <!-- 【右の壁】 -->
        <transform translation="2 0 0" rotation="0 1 0 -1.5708">
          <shape>
            <appearance><material diffuseColor="0.08 0.08 0.12"></material></appearance>
            <box size="4 4 0.1"></box>
          </shape>
        </transform>

        <!-- 【中央のフィギュア / オブジェクト】 -->
        <transform id="targetBox" translation="0 -0.5 0">
          <shape>
            <appearance>
              <material diffuseColor="0.2 0.8 1.0" specularColor="0.8 0.8 0.8"></material>
            </appearance>
            <box size="1.5 2.2 1.5"></box>
          </shape>
        </transform>

      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) { logElem.innerText = msg; }

    const vp = document.getElementById('vp');
    const roomGroup = document.getElementById('roomGroup');
    const videoElement = document.getElementById('webcam');

    let frameCount = 0;

    // MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      frameCount++;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        // 顔の画面中央からのズレ (-0.5 〜 0.5)
        const offsetX = (nose.x - 0.5);
        const offsetY = (nose.y - 0.5);

        // ★パースペクティブ（視差）感度
        const sensitivity = 1.3;

        // 顔の動きに合わせて「箱全体」を連動傾斜させることで、
        // 画面枠を「窓」とした奥行き（床・奥壁・側面の変化）を生み出します
        const rotX = -offsetY * sensitivity; 
        const rotY =  offsetX * sensitivity; 

        const angle = Math.sqrt(rotX * rotX + rotY * rotY);

        if (angle > 0.001) {
          const axisX = rotX / angle;
          const axisY = rotY / angle;
          roomGroup.setAttribute('rotation', `${axisX.toFixed(3)} ${axisY.toFixed(3)} 0 ${angle.toFixed(3)}`);
        } else {
          roomGroup.setAttribute('rotation', '0 1 0 0');
        }

        log(`[#${frameCount}] 追従中 | 覗き込み位置: X=${offsetX.toFixed(2)}, Y=${offsetY.toFixed(2)}`);
      } else {
        log(`[#${frameCount}] 顔を検出できません`);
      }
    });

    // Webカメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message);
      }
    }

    async function processVideoFrame() {
      if (videoElement.readyState >= 2 && !videoElement.paused && !videoElement.ended) {
        try {
          await faceMesh.send({ image: videoElement });
        } catch (e) {
          console.error("FaceMeshエラー:", e);
        }
      }
      requestAnimationFrame(processVideoFrame);
    }

    startCamera();
  </script>
</body>
</html>
