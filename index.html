<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM Face Tracking Rotation</title>
  
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111; color: #fff;
      font-family: sans-serif;
    }
    x3d {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; margin: 0; padding: 0;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #6bffb8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>X3DOM 視線追従オブジェクト回転</h2>
    <div id="debug-log">カメラ許可を待っています...</div>
  </div>

  <x3d id="x3dCanvas">
    <scene>
      <!-- カメラ位置（Zは自動調整されます） -->
      <viewpoint id="vp" position="0 0 5" orientation="0 1 0 0" fieldOfView="0.785"></viewpoint>
      
      <!-- テスト用ボックス (どのようなサイズに変更してもゆとりをもって自動調整されます) -->
      <transform id="targetBox" rotation="0 1 0 0" translation="0 0 0">
        <shape>
          <appearance>
            <material diffuseColor="0.2 0.7 1.0" specularColor="0.5 0.5 0.5"></material>
          </appearance>
          <box size="2.5 2.5 2.5"></box>
        </shape>
      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) {
      logElem.innerText = msg;
    }

    const vp = document.getElementById('vp');
    const targetBox = document.getElementById('targetBox');
    const videoElement = document.getElementById('webcam');

    // -------------------------------------------------------------
    // 物体の大きさに応じてカメラ距離(Z)を自動調整し、余白をつくる関数
    // -------------------------------------------------------------
    function fitObjectToScreen() {
      if (!targetBox || !targetBox._x3domNode) return;

      try {
        const bbox = targetBox._x3domNode.getBBox();
        const sizeX = bbox.max.x - bbox.min.x;
        const sizeY = bbox.max.y - bbox.min.y;
        const sizeZ = bbox.max.z - bbox.min.z;

        const maxDimension = Math.max(sizeX, sizeY, sizeZ);

        const fov = parseFloat(vp.getAttribute('fieldOfView')) || 0.785;
        const aspect = window.innerWidth / window.innerHeight;
        const fovFactor = aspect < 1 ? (fov * aspect) : fov;

        // ★余白の調整（1.8 で上下左右に綺麗なゆとりが生まれます）
        const marginFactor = 2.8;

        const baseCameraZ = (maxDimension / (2 * Math.tan(fovFactor / 2))) * marginFactor;
        vp.setAttribute('position', `0 0 ${baseCameraZ.toFixed(2)}`);
      } catch (e) {
        // ロード待ち用
      }
    }

    document.addEventListener('x3dom-loaded', () => {
      setTimeout(fitObjectToScreen, 200);
    }, false);

    window.addEventListener('resize', fitObjectToScreen);

    // MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // 追従ログ用カウンター（動いているか視覚的に確認するため）
    let frameCount = 0;

    faceMesh.onResults((results) => {
      frameCount++;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        // 顔の画面中央からのズレ量 (-0.5 〜 0.5)
        const offsetX = (nose.x - 0.5);
        const offsetY = (nose.y - 0.5);

        // 覗き込みの移動強度（大きくするとより大きく視点が移動します）
        const eyeMoveScale = 2.5;

        // 1. 物体は中央で完全固定（回さない）
        targetBox.setAttribute('rotation', '0 1 0 0');

        // 2. 目線（カメラ）の位置を計算
        const camX =  offsetX * eyeMoveScale;
        const camY = -offsetY * eyeMoveScale;
        const camZ = typeof baseCameraZ !== 'undefined' ? baseCameraZ : 5;

        vp.setAttribute('position', `${camX.toFixed(3)} ${camY.toFixed(3)} ${camZ.toFixed(3)}`);

        // -------------------------------------------------------------
        // ★ここを修正！
        // カメラがズレた分だけ「中央（0,0,0）」を向き直す回転角度を計算
        // -------------------------------------------------------------
        // Y軸回転（左右の注視）
        const rotY = -Math.atan2(camX, camZ);
        // X軸回転（上下の注視）
        const rotX =  Math.atan2(camY, Math.sqrt(camX * camX + camZ * camZ));

        // 回転の合成角
        const angle = Math.sqrt(rotX * rotX + rotY * rotY);

        if (angle > 0.001) {
          const axisX = rotX / angle;
          const axisY = rotY / angle;
          // 中央を向くようにカメラの向きを更新
          vp.setAttribute('orientation', `${axisX.toFixed(3)} ${axisY.toFixed(3)} 0 ${angle.toFixed(3)}`);
        } else {
          vp.setAttribute('orientation', '0 1 0 0');
        }

        log(`[#${frameCount}] 覗き込み中 | 目線: X=${camX.toFixed(2)}, Y=${camY.toFixed(2)}`);
      } else {
        log(`[#${frameCount}] 顔を検出できません`);
      }
    });

    // Webカメラ起動＆頑丈な処理ループ
    async function startCamera() {
      log("カメラ初期化中...");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          log("映像取得開始。解析を開始します...");
          processVideoFrame();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message);
      }
    }

    // エラーが起きてもループを落とさない堅牢なフレーム送信処理
    async function processVideoFrame() {
      if (videoElement.readyState >= 2 && !videoElement.paused && !videoElement.ended) {
        try {
          await faceMesh.send({ image: videoElement });
        } catch (e) {
          console.error("FaceMesh送信エラー:", e);
        }
      }
      // 成功・失敗にかかわらず次のフレームを呼び出す（止まり防止）
      requestAnimationFrame(processVideoFrame);
    }

    startCamera();
  </script>
</body>
</html>
