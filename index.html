<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FishTank VR - Menu</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* 全体設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 背景画像設定 */
    .title-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('タイトル画面.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6vh;
    }

    /* メニューバー配置コンテナ（下部ポップアップカード） */
    .menu-group {
      width: 88%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      padding: 20px 16px;
      background: rgba(8, 20, 40, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(107, 255, 184, 0.25);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);

      /* ★ 起動時の下部からのポップアップアニメーション設定 */
      animation: popupFromBottom 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ★ 画面下外（120%）から中央位置へのポップアップ定義 */
    @keyframes popupFromBottom {
      0% {
        opacity: 0;
        transform: translateY(120%);
      }
      70% {
        opacity: 1;
        transform: translateY(-8px); /* わずかなバウンス効果 */
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 各ナビゲーションリンクバー（ボタン） */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      /* サイバー風ガラスモーフィズム（半透明＋ブラー） */
      background: rgba(12, 30, 60, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(107, 255, 184, 0.4);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;

      /* ★ カード登場後の時間差でのフェードイン */
      opacity: 0;
      animation: itemFadeIn 0.5s ease-out forwards;
    }

    /* ★ ボタンごとの表示ディレイ（順番に表示） */
    .nav-bar:nth-child(1) { animation-delay: 0.35s; }
    .nav-bar:nth-child(2) { animation-delay: 0.45s; }
    .nav-bar:nth-child(3) { animation-delay: 0.55s; }
    .nav-bar:nth-child(4) { animation-delay: 0.65s; }

    @keyframes itemFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* タップ／ホバー時の光るグラデーションアニメーション */
    .nav-bar:hover, .nav-bar:active {
      background: rgba(20, 55, 100, 0.9);
      border-color: #6bffb8;
      box-shadow: 0 0 20px rgba(107, 255, 184, 0.6),
                  inset 0 0 15px rgba(107, 255, 184, 0.3);
      transform: translateY(-2px) scale(1.02);
    }

    /* ボタン右側の矢印アイコン */
    .nav-bar::after {
      content: '➔';
      font-size: 0.9rem;
      color: #6bffb8;
      transition: transform 0.2s;
    }

    .nav-bar:hover::after, .nav-bar:active::after {
      transform: translateX(4px);
    }

    /* 実験用リンクなどの強調スタイル */
    .nav-bar.highlight {
      border-color: rgba(0, 191, 255, 0.7);
      background: rgba(0, 45, 95, 0.85);
    }
    
    .nav-bar.highlight:hover, .nav-bar.highlight:active {
      border-color: #00bfff;
      box-shadow: 0 0 20px rgba(0, 191, 255, 0.7),
                  inset 0 0 15px rgba(0, 191, 255, 0.4);
    }

    .nav-bar.highlight::after {
      color: #00bfff;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <!-- 各コンテンツへのリンクバー（ボトムポップアップカード） -->
    <div class="menu-group">
      <a href="pingu.htm" class="nav-bar">
        <span>PINGU 3D</span>
      </a>
      <a href="pingu2.htm" class="nav-bar">
        <span>PINGU 3D Ver.2</span>
      </a>
      <a href="demobox.htm" class="nav-bar">
        <span>PINGU Prototype</span>
      </a>
      <!-- 被験者比較実験用 -->
      <a href="title.htm" class="nav-bar highlight">
        <span>Experimental space</span>
      </a>
    </div>
  </div>

</body>
</html>
