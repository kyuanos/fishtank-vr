<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anamorphic Portal Box with Cube</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #stage { width: 100vw; height: 100vh; display: block; }
    #ui {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      color: #6bffb8; background: rgba(0,0,0,0.8); padding: 8px 16px;
      border-radius: 8px; font-family: sans-serif; font-size: 0.8rem;
      z-index: 10; display: flex; align-items: center; gap: 10px;
    }
    #toggle-btn {
      background: #6bffb8; color: #000; border: none;
      padding: 4px 10px; border-radius: 4px; font-weight: bold;
      cursor: pointer; font-size: 0.75rem;
    }
    #toggle-btn:active { opacity: 0.8; }
  </style>
  <!-- Three.js & MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui">
    <span id="log-text">カメラ・画像を読み込んでいます...</span>
    <button id="toggle-btn">回転: ON</button>
  </div>

  <canvas id="stage"></canvas>
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('log-text');
    const toggleBtn = document.getElementById('toggle-btn');
    const videoElement = document.getElementById('webcam');

    // ★ 回転のON/OFF状態管理フラグ
    let isRotating = true;

    function toggleRotation(e) {
      if (e) e.stopPropagation(); // イベントのバブリング防止
      isRotating = !isRotating;
      toggleBtn.innerText = `回転: ${isRotating ? 'ON' : 'OFF'}`;
    }

    toggleBtn.addEventListener('click', toggleRotation);

    // 1. Scene & Renderer Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const baseCameraZ = 5;
    camera.position.set(0, 0, baseCameraZ);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    // 2. Load Textures
    const textureLoader = new THREE.TextureLoader();
    const roomMaterials = [
      new THREE.MeshBasicMaterial({ map: textureLoader.load('右壁２.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('左壁２.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('天井壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('床.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('奥壁２.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, side: THREE.BackSide })
    ];

    let room;
    let cubeMesh;
    let screenWidth = 0;
    let screenHeight = 0;
    
    const depthRatio = 0.35;

    // 3. 部屋と内部キューブの生成
    function createSceneObjects() {
      const fovRad = (camera.fov * Math.PI) / 180;
      const aspect = window.innerWidth / window.innerHeight;

      screenHeight = 2 * Math.tan(fovRad / 2) * baseCameraZ;
      screenWidth = screenHeight * aspect;
      const roomDepth = screenHeight * depthRatio;

      if (room) scene.remove(room);
      if (cubeMesh) scene.remove(cubeMesh);

      // ① 部屋（背景）
      const roomGeo = new THREE.BoxGeometry(screenWidth, screenHeight, roomDepth);
      room = new THREE.Mesh(roomGeo, roomMaterials);
      room.position.set(0, 0, -roomDepth / 2);
      scene.add(room);

      // ② 正方形キューブ
      const cubeSize = Math.min(screenWidth, screenHeight) * 0.35;
      const cubeGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
      
      const cubeMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x44aa88, 
        roughness: 0.4,
        metalness: 0.2
      });
      
      cubeMesh = new THREE.Mesh(cubeGeo, cubeMaterial);
      cubeMesh.position.set(0, -screenHeight * 0.1, -roomDepth * 0.5);
      cubeMesh.rotation.y = Math.PI / 6; 
      scene.add(cubeMesh);
    }

    createSceneObjects();

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      renderer.setSize(w, h);
      createSceneObjects();
    });

    // 4. Off-Axis Projection
    function setOffAxisProjection(headX, headY) {
      const camX = -headX * 4;
      const camY = -headY * 4;
      const camZ = baseCameraZ;

      camera.position.set(camX, camY, camZ);

      const left   = -screenWidth / 2 - camX;
      const right  =  screenWidth / 2 - camX;
      const top    =  screenHeight / 2 - camY;
      const bottom = -screenHeight / 2 - camY;

      const near = camera.near;
      const far  = camera.far;

      const scale = near / camZ;
      const l = left * scale;
      const r = right * scale;
      const t = top * scale;
      const b = bottom * scale;

      camera.projectionMatrix.makePerspective(l, r, t, b, near, far);
    }

    // 5. Face Tracking
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const nose = results.multiFaceLandmarks[0][1];
        targetX = (nose.x - 0.5);
        targetY = (nose.y - 0.5);
        logElem.innerText = `追従中 | X: ${targetX.toFixed(2)}, Y: ${targetY.toFixed(2)}`;
      }
    });

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideo();
        };
      } catch (e) {
        logElem.innerText = "カメラエラー: " + e.message;
      }
    }

    async function processVideo() {
      if (videoElement.readyState >= 2) {
        await faceMesh.send({ image: videoElement });
      }
      requestAnimationFrame(processVideo);
    }

    function render() {
      currentX += (targetX - currentX) * 0.12;
      currentY += (targetY - currentY) * 0.12;

      setOffAxisProjection(currentX, currentY);

      // ★ ONの時だけキューブを回転させる
      if (cubeMesh && isRotating) {
        cubeMesh.rotation.y += 0.01;
        cubeMesh.rotation.x += 0.005;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    // 描画ループとカメラの起動
    render();
    initCamera();
  </script>
</body>
</html>
