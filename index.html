<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM Face Tracking Rotation</title>
  
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111; color: #fff;
      font-family: sans-serif;
    }
    x3d {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; margin: 0; padding: 0;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #6bffb8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>X3DOM 視線追従オブジェクト回転</h2>
    <div id="debug-log">カメラ許可を待っています...</div>
  </div>

  <x3d id="x3dCanvas">
    <scene>
      <!-- カメラ位置は画面真正面で固定 (Z=5) -->
      <viewpoint id="vp" position="0 0 5" orientation="0 1 0 0" fieldOfView="0.785"></viewpoint>
      
      <!-- テスト用ボックス (中心 Z=0, 初期は回転なし) -->
      <transform id="targetBox" rotation="0 1 0 0" translation="0 0 0">
        <shape>
          <appearance>
            <material diffuseColor="0.2 0.7 1.0" specularColor="0.5 0.5 0.5"></material>
          </appearance>
          <!-- 大きさを 2.5 に変更して大きめの真正面表示 -->
          <box size="2.5 2.5 2.5"></box>
        </shape>
      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) {
      logElem.innerText = msg;
    }

    const targetBox = document.getElementById('targetBox');
    const videoElement = document.getElementById('webcam');

    // MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        // -------------------------------------------------------------
        // 顔の画面中央からのズレ量を計算 (-0.5 〜 0.5 の範囲)
        // -------------------------------------------------------------
        const offsetX = (nose.x - 0.5); // 右に行くとプラス、左に行くとマイナス
        const offsetY = (nose.y - 0.5); // 下に行くとプラス、上に行くとマイナス

        // 回転の傾き強度（数字を大きくすると顔の動きに対して大きく傾きます）
        const sensitivity = 1.2;

        // X3DOMの回転指定方法: "X軸 Y軸 Z軸 回転角度(ラジアン)"
        // 顔のY軸移動（上下）でX軸回転、顔のX軸移動（左右）でY軸回転を行わせる
        const rotX = -offsetY * sensitivity; // 上下覗き込み
        const rotY = offsetX * sensitivity; // 左右覗き込み

        // 回転の大きさを計算（ベクトルの長さ）
        const angle = Math.sqrt(rotX * rotX + rotY * rotY);

        if (angle > 0.001) {
          // X3DOMの rotation 属性形式（軸ベクトル + 回転角）に更新
          const axisX = rotX / angle;
          const axisY = rotY / angle;
          targetBox.setAttribute('rotation', `${axisX.toFixed(3)} ${axisY.toFixed(3)} 0 ${angle.toFixed(3)}`);
        } else {
          targetBox.setAttribute('rotation', '0 1 0 0');
        }

        log(`追従中 | 顔位置: X=${offsetX.toFixed(2)}, Y=${offsetY.toFixed(2)} | 傾き角度: ${angle.toFixed(2)} rad`);
      } else {
        log("顔を検出できません（カメラの正面に顔を向けてください）");
      }
    });

    // Webカメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message);
      }
    }

    async function processVideoFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await faceMesh.send({ image: videoElement });
        requestAnimationFrame(processVideoFrame);
      }
    }

    startCamera();
  </script>
</body>
</html>
