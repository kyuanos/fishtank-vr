<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anamorphic Portal Box</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000; color: #fff;
      font-family: sans-serif;
    }
    #stage {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #6bffb8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>2D画像歪みアナモルフィック箱</h2>
    <div id="debug-log">画像を読み込んでいます...</div>
  </div>

  <canvas id="stage"></canvas>
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) { logElem.innerText = msg; }

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const videoElement = document.getElementById('webcam');

    // 画像の読み込み
    const imgNames = ['床.jpg', '奥壁.jpg', '左壁.jpg', '右壁.jpg', '天井壁.jpg'];
    const images = {};
    let loadedCount = 0;

    imgNames.forEach(name => {
      const img = new Image();
      img.src = name;
      img.onload = () => {
        loadedCount++;
        if (loadedCount === imgNames.length) {
          log("画像読み込み完了。カメラ許可を待っています...");
          initCamera();
        }
      };
      img.onerror = () => {
        log(`画像「${name}」の読み込みに失敗しました。ファイル名を確認してください。`);
      };
      images[name] = img;
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // アナモルフィック（遠近視点変換）描画処理
    // 画面の4隅と、奥の壁の4頂点（消失点）を繋ぐ4つの四角形に画像を投影・湾曲描画
    function drawAnamorphicRoom(headX, headY) {
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      // 箱の奥行き感（画面サイズに対する奥の壁のサイズ割合）
      const depthRatio = 0.45;

      // 顔の動きに応じた奥の壁（消失点）の中心位置
      // 顔を左に動かすと奥壁は右にズレる（錯覚効果）
      const backCenterX = w / 2 - headX * w * 0.8;
      const backCenterY = h / 2 - headY * h * 0.8;

      const backW = w * depthRatio;
      const backH = h * depthRatio;

      // 奥の壁の4頂点座標 [TL, TR, BR, BL]
      const backWallQuad = [
        { x: backCenterX - backW / 2, y: backCenterY - backH / 2 },
        { x: backCenterX + backW / 2, y: backCenterY - backH / 2 },
        { x: backCenterX + backW / 2, y: backCenterY + backH / 2 },
        { x: backCenterX - backW / 2, y: backCenterY + backH / 2 }
      ];

      // 画面（窓枠）の4頂点座標
      const screenQuad = [
        { x: 0, y: 0 },
        { x: w, y: 0 },
        { x: w, y: h },
        { x: 0, y: h }
      ];

      // 1. 奥壁描画
      drawQuadImage(images['奥壁.jpg'], backWallQuad);

      // 2. 床描画 (画面下辺2点 と 奥壁下辺2点)
      const floorQuad = [
        backWallQuad[3],
        backWallQuad[2],
        screenQuad[2],
        screenQuad[3]
      ];
      drawQuadImage(images['床.jpg'], floorQuad);

      // 3. 天井描画 (画面上辺2点 と 奥壁上辺2点)
      const ceilingQuad = [
        screenQuad[0],
        screenQuad[1],
        backWallQuad[1],
        backWallQuad[0]
      ];
      drawQuadImage(images['天井壁.jpg'], ceilingQuad);

      // 4. 左壁描画 (画面左辺2点 と 奥壁左辺2点)
      const leftQuad = [
        screenQuad[0],
        backWallQuad[0],
        backWallQuad[3],
        screenQuad[3]
      ];
      drawQuadImage(images['左壁.jpg'], leftQuad);

      // 5. 右壁描画 (画面右辺2点 と 奥壁右辺2点)
      const rightQuad = [
        backWallQuad[1],
        screenQuad[1],
        screenQuad[2],
        backWallQuad[2]
      ];
      drawQuadImage(images['右壁.jpg'], rightQuad);
    }

    // 4頂点自由変形（メッシュ分割による簡易テクスチャマッピング）
    function drawQuadImage(img, quad) {
      if (!img) return;
      
      const grid = 8; // 分割精度（大きくするとよりスムーズに湾曲）
      
      for (let gy = 0; gy < grid; gy++) {
        for (let gx = 0; gx < grid; gx++) {
          const u0 = gx / grid;
          const v0 = gy / grid;
          const u1 = (gx + 1) / grid;
          const v1 = (gy + 1) / grid;

          const p0 = bilinearInterpolate(quad, u0, v0);
          const p1 = bilinearInterpolate(quad, u1, v0);
          const p2 = bilinearInterpolate(quad, u1, v1);
          const p3 = bilinearInterpolate(quad, u0, v1);

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.closePath();
          ctx.clip();

          // 三角形アフィン変換描画
          const sx = u0 * img.width;
          const sy = v0 * img.height;
          const sw = (u1 - u0) * img.width;
          const sh = (v1 - v0) * img.height;

          // 近似バウンディングボックスに描画
          const minX = Math.min(p0.x, p1.x, p2.x, p3.x);
          const minY = Math.min(p0.y, p1.y, p2.y, p3.y);
          const maxX = Math.max(p0.x, p1.x, p2.x, p3.x);
          const maxY = Math.max(p0.y, p1.y, p2.y, p3.y);

          ctx.drawImage(img, sx, sy, sw, sh, minX - 0.5, minY - 0.5, (maxX - minX) + 1, (maxY - minY) + 1);
          ctx.restore();
        }
      }
    }

    function bilinearInterpolate(quad, u, v) {
      const x = (1 - u) * (1 - v) * quad[0].x + u * (1 - v) * quad[1].x + u * v * quad[2].x + (1 - u) * v * quad[3].x;
      const y = (1 - u) * (1 - v) * quad[0].y + u * (1 - v) * quad[1].y + u * v * quad[2].y + (1 - u) * v * quad[3].y;
      return { x, y };
    }

    // MediaPipe Face Mesh
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        targetX = (nose.x - 0.5);
        targetY = (nose.y - 0.5);

        log(`追従中 | X: ${targetX.toFixed(2)}, Y: ${targetY.toFixed(2)}`);
      }
    });

    function render() {
      // スムース補間（LERP）
      currentX += (targetX - currentX) * 0.15;
      currentY += (targetY - currentY) * 0.15;

      drawAnamorphicRoom(currentX, currentY);
      requestAnimationFrame(render);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
          render();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message);
      }
    }

    async function processVideoFrame() {
      if (videoElement.readyState >= 2 && !videoElement.paused && !videoElement.ended) {
        try {
          await faceMesh.send({ image: videoElement });
        } catch (e) {}
      }
      requestAnimationFrame(processVideoFrame);
    }
  </script>
</body>
</html>
