<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anamorphic Portal Box - FishTank VR Mode</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js & MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <a href="pingu.htm" target="_blank" class="link-button">pinguを開く</a>

  <div id="ui">
    <span id="log-text">カメラ・画像を読み込んでいます...</span>
    <div class="btn-group">
      <button id="mode-btn">現在のモード: モードA (FishTank視差)</button>
      <button id="toggle-btn">回転: ON</button>
    </div>

    <!-- 壁紙アップロードUI -->
    <div id="texture-panel">
      <div class="upload-item"><label>左壁 (1):</label><input type="file" id="input-left" accept="image/*"></div>
      <div class="upload-item"><label>天井 (2):</label><input type="file" id="input-top" accept="image/*"></div>
      <div class="upload-item"><label>右壁 (3):</label><input type="file" id="input-right" accept="image/*"></div>
      <div class="upload-item"><label>床  (4):</label><input type="file" id="input-bottom" accept="image/*"></div>
      <div class="upload-item"><label>奥壁  :</label><input type="file" id="input-back" accept="image/*"></div>
    </div>
  </div>

  <canvas id="stage"></canvas>
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <!-- JSファイルの読み込み -->
  <script src="main.js"></script>
</body>
</html>
