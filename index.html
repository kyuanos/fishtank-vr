<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM Fish Tank VR</title>
  
  <!-- X3DOM ライブラリ -->
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  
  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* スクロールバーを完全非表示 */
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }

    /* X3D描画キャンバスを画面全体に固定 */
    x3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      z-index: 1;
    }

    /* UIオーバーレイ（テキストや操作ボタンを画面の上に浮かせる） */
    #ui-overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none; /* 下の3D操作を邪魔しない */
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 8px;
    }

    #ui-overlay h2 {
      margin: 0 0 4px 0;
      font-size: 1.1rem;
    }

    #ui-overlay p {
      margin: 0;
      font-size: 0.85rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- UIテキスト（画面の上にオーバーレイ表示） -->
  <div id="ui-overlay">
    <h2>X3DOM フィッシュタンクVR</h2>
    <p>頭を動かすと視点が追従します（スマホ縦・横対応）</p>
  </div>

  <!-- 全画面 3D 描画領域 -->
  <x3d id="x3dCanvas">
    <scene>
      <viewpoint id="vp" position="0 0 10" orientation="0 1 0 0" fieldOfView="0.8"></viewpoint>
      
      <transform id="targetBox" rotation="0 1 0 0.523598776" translation="0 0 0">
        <shape>
          <appearance>
            <material diffuseColor="0.7 0.6 1.0" specularColor="0.5 0.5 0.5"></material>
          </appearance>
          <box size="5 5 5"></box>
        </shape>
      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const vp = document.getElementById('vp');
    const videoElement = document.getElementById('webcam');
    const x3dCanvas = document.getElementById('x3dCanvas');

    // 画面アスペクト比・サイズの更新関数
    function updateLayout() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const aspect = width / height;

      // 縦持ち（aspect < 1）の時、視体積（視野角）が狭くなりすぎないよう微調整
      if (aspect < 1.0) {
        vp.setAttribute('fieldOfView', (0.8 / aspect).toFixed(2));
      } else {
        vp.setAttribute('fieldOfView', '0.8');
      }

      // X3DOMキャンバスのリセット通知
      if (x3dCanvas && x3dCanvas.runtime) {
        x3dCanvas.runtime.resize(width, height);
      }
    }

    // リサイズ・画面回転イベントの登録
    window.addEventListener('resize', updateLayout);
    window.addEventListener('orientationchange', updateLayout);
    updateLayout();

    // MediaPipe Face Mesh の初期化
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        const x = (0.5 - nose.x) * 15;
        const y = (0.5 - nose.y) * 15;
        const z = 5 + (1.0 - nose.z) * 10;

        vp.setAttribute('position', `${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`);
      }
    });

    // カメラ起動処理
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;

        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
        };
      } catch (err) {
        console.error("カメラのアクセスに失敗しました:", err);
        alert("カメラへのアクセスを許可してください（HTTPS環境またはlocalhostで開く必要があります）。");
      }
    }

    async function processVideoFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await faceMesh.send({ image: videoElement });
        requestAnimationFrame(processVideoFrame);
      }
    }

    startCamera();
  </script>
</body>
</html>
