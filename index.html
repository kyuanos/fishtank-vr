<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X3DOM Fish Tank VR (Safe Fix)</title>
  
  <!-- X3DOM CDN -->
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111; color: #fff;
      font-family: sans-serif;
    }
    x3d {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; margin: 0; padding: 0;
      display: block; z-index: 1;
    }
    #ui-overlay {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px; border-radius: 8px;
      max-width: 90vw;
    }
    #ui-overlay h2 { margin: 0 0 4px 0; font-size: 1rem; }
    #debug-log { margin: 4px 0 0 0; font-size: 0.75rem; color: #ff6b6b; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h2>X3DOM Fish Tank VR</h2>
    <div id="debug-log">ステータス: 初期化中...</div>
  </div>

  <x3d id="x3dCanvas">
    <scene>
      <!-- Viewpointの指定 -->
      <viewpoint id="vp" position="0 0 10" orientation="0 1 0 0" fieldOfView="0.785"></viewpoint>
      
      <!-- テスト用ボックス -->
      <transform id="targetBox" rotation="0.5 1 0 0.5">
        <shape>
          <appearance>
            <material diffuseColor="0.2 0.7 1.0" specularColor="0.5 0.5 0.5"></material>
          </appearance>
          <box size="2 2 2"></box>
        </shape>
      </transform>
    </scene>
  </x3d>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('debug-log');
    function log(msg) {
      logElem.innerText = msg;
      console.log(msg);
    }

    const vp = document.getElementById('vp');
    const videoElement = document.getElementById('webcam');

    let screenWidth = 0.10;
    let screenHeight = 0.18;
    let isX3domReady = false;

    // X3DOMのノード準備完了を検知
    document.addEventListener('x3dom-loaded', () => {
      isX3domReady = true;
      log("X3DOM準備完了。カメラ接続中...");
    }, false);

    function updateScreenSize() {
      const aspect = window.innerWidth / window.innerHeight;
      if (aspect > 1) {
        screenWidth = 0.18; screenHeight = 0.10;
      } else {
        screenWidth = 0.10; screenHeight = 0.18;
      }
    }
    window.addEventListener('resize', updateScreenSize);
    updateScreenSize();

    // Off-Axis 視体積再計算
    function setOffAxisFrustum(PeX, PeY, PeZ) {
      // X3DOMの内部ノードが生成されていない場合は実行をスキップ（表示消滅の防止）
      if (!isX3domReady || !vp || !vp._x3domNode) return;

      const near = 0.1;
      const far = 100.0;

      const L = -screenWidth / 2;
      const R =  screenWidth / 2;
      const B = -screenHeight / 2;
      const T =  screenHeight / 2;

      const l = (L - PeX) * (near / PeZ);
      const r = (R - PeX) * (near / PeZ);
      const b = (B - PeY) * (near / PeZ);
      const t = (T - PeY) * (near / PeZ);

      try {
        const proj = new x3dom.fields.SFMatrix4f(
          (2 * near) / (r - l), 0,                    (r + l) / (r - l),  0,
          0,                    (2 * near) / (t - b), (t + b) / (t - b),  0,
          0,                    0,                   -(far + near) / (far - near), -(2 * far * near) / (far - near),
          0,                    0,                   -1,                  0
        );

        vp._x3domNode.getProjectionMatrix = function() {
          return proj;
        };
      } catch (e) {
        log("行列計算エラー: " + e.message);
      }
    }

    // MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        
        const PeX = (nose.x - 0.5) * 0.3;
        const PeY = (0.5 - nose.y) * 0.3;
        const PeZ = 0.4 + (nose.z) * 0.3;

        vp.setAttribute('position', `${PeX} ${PeY} ${PeZ}`);
        setOffAxisFrustum(PeX, PeY, PeZ);
        log(`追従中 - Eye Pos: (${PeX.toFixed(2)}, ${PeY.toFixed(2)}, ${PeZ.toFixed(2)})`);
      } else {
        log("顔を検出できません");
      }
    });

    // Webカメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideoFrame();
        };
      } catch (err) {
        log("カメラ起動失敗: " + err.message + "\n※ブラウザのカメラ権限を確認してください");
      }
    }

    async function processVideoFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await faceMesh.send({ image: videoElement });
        requestAnimationFrame(processVideoFrame);
      }
    }

    startCamera();
  </script>
</body>
</html>
