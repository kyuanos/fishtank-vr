<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anamorphic Portal Box (Aspect Fitted)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #stage { width: 100vw; height: 100vh; display: block; }
    #ui {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      color: #6bffb8; background: rgba(0,0,0,0.8); padding: 8px 16px;
      border-radius: 8px; font-family: sans-serif; font-size: 0.8rem; pointer-events: none;
      z-index: 10;
    }
  </style>
  <!-- Three.js & MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui">カメラ・画像を読み込んでいます...</div>
  <canvas id="stage"></canvas>
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const logElem = document.getElementById('ui');
    const videoElement = document.getElementById('webcam');

    // 1. Scene, Camera, Renderer Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // 2. Load Textures (各面1枚ずつ)
    const textureLoader = new THREE.TextureLoader();
    const materials = [
      new THREE.MeshBasicMaterial({ map: textureLoader.load('右壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('左壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('天井壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('床.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ map: textureLoader.load('奥壁.jpg'), side: THREE.BackSide }),
      new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide }) // 手前（窓枠部分）
    ];

    // 画面のアス比に合わせて箱の形状を作成する関数
    let room;
    const depth = 4; // 箱の奥行き

    function createOrUpdateRoom() {
      const aspect = window.innerWidth / window.innerHeight;
      const height = 4;         // 高さ固定
      const width = height * aspect; // 画面のアスペクト比に合わせる

      if (room) {
        scene.remove(room);
        room.geometry.dispose();
      }

      const boxGeo = new THREE.BoxGeometry(width, height, depth);
      room = new THREE.Mesh(boxGeo, materials);
      room.position.z = -depth / 2; // 画面の手前枠を z=0 に配置
      scene.add(room);
    }

    createOrUpdateRoom();

    // ウィンドウサイズ変更対応
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      createOrUpdateRoom();
    });

    // 3. 視点移動計算（左右の移動方向を反転補正）
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;

    function updateProjection(headX, headY) {
      // ★ X軸の正負を反転させて左右の動きを正常化
      camera.position.x = -headX * 4;
      camera.position.y = -headY * 4;

      // 視点を箱の中心（手前窓枠の中心 z=0）に向ける
      camera.lookAt(0, 0, -depth / 2);
    }

    // 4. Face Tracking Setup
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const nose = results.multiFaceLandmarks[0][1];
        targetX = (nose.x - 0.5);
        targetY = (nose.y - 0.5);
        logElem.innerText = `追従中 | X: ${targetX.toFixed(2)}, Y: ${targetY.toFixed(2)}`;
      }
    });

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          processVideo();
          render();
        };
      } catch (e) {
        logElem.innerText = "カメラエラー: " + e.message;
      }
    }

    async function processVideo() {
      if (videoElement.readyState >= 2) {
        await faceMesh.send({ image: videoElement });
      }
      requestAnimationFrame(processVideo);
    }

    function render() {
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;

      updateProjection(currentX, currentY);

      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    initCamera();
  </script>
</body>
</html>
